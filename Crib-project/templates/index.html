<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cribbage Score Tracker</title>
  <meta name="theme-color" content="#faf9f5">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23d9b384"/><circle cx="22" cy="32" r="9" fill="%23cc2222"/><circle cx="42" cy="32" r="9" fill="%232255cc"/></svg>'>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>Cribbage Score Tracker</h1>
      <div class="controls">
        <label>
          Game to
          <select id="target-score">
            <option value="121" {% if game.target == 121 %}selected{% endif %}>121</option>
            <option value="61" {% if game.target == 61 %}selected{% endif %}>61</option>
          </select>
        </label>
        <button id="undo-btn">↶ Undo</button>
        <button id="reset-btn">↻ Reset</button>
      </div>
    </header>

    <div id="winner-banner" class="winner-banner hidden"></div>

    <div class="players">
      <div class="player-card" data-player="0">
        <div class="card-top">
          <input class="player-name" data-player="0" value="{{ game.names[0] }}" maxlength="30">
          <button class="dealer-chip" data-player="0">Set dealer</button>
        </div>
        <div class="score-row">
          <span class="score" data-player="0">{{ game.scores[0] }}</span>
          <span class="target">/ <span class="target-display">{{ game.target }}</span></span>
          <span class="lead-badge hidden" data-player="0"></span>
        </div>
        <div class="peg-buttons">
          <button class="peg-btn" data-player="0" data-points="1">+1</button>
          <button class="peg-btn" data-player="0" data-points="2">+2</button>
        </div>
        <div class="custom-row">
          <input type="number" class="custom-input" data-player="0" placeholder="Enter points">
          <button class="custom-btn" data-player="0">Add</button>
        </div>
      </div>

      <div class="player-card" data-player="1">
        <div class="card-top">
          <input class="player-name" data-player="1" value="{{ game.names[1] }}" maxlength="30">
          <button class="dealer-chip" data-player="1">Set dealer</button>
        </div>
        <div class="score-row">
          <span class="score" data-player="1">{{ game.scores[1] }}</span>
          <span class="target">/ <span class="target-display">{{ game.target }}</span></span>
          <span class="lead-badge hidden" data-player="1"></span>
        </div>
        <div class="peg-buttons">
          <button class="peg-btn" data-player="1" data-points="1">+1</button>
          <button class="peg-btn" data-player="1" data-points="2">+2</button>
        </div>
        <div class="custom-row">
          <input type="number" class="custom-input" data-player="1" placeholder="Enter points">
          <button class="custom-btn" data-player="1">Add</button>
        </div>
      </div>
    </div>

    <div class="board-wrapper">
      <svg id="board" viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <details class="history-panel">
      <summary>History</summary>
      <div id="history-log"></div>
    </details>
  </div>

  <script>
    window.INITIAL_STATE = {{ game | tojson }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
